<!doctype html>
<!-- Template: the /thanks page. build.mjs fills the double-brace keys from page/strings/<lang>.json and builds the list from credits.json. -->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{thanks_page_title}}</title>
<meta name="description" content="{{thanks_lead}}">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FEF2E2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17141F" media="(prefers-color-scheme: dark)">
<script src="/ellenial-theme.js" data-light="#FEF2E2" data-dark="#17141F"></script>
<link rel="alternate" hreflang="en" href="https://ellenial.app/thanks">
<link rel="alternate" hreflang="sv" href="https://ellenial.app/sv/thanks">
<link rel="alternate" hreflang="x-default" href="https://ellenial.app/thanks">
<script src="/lang.js"></script>
<link rel="preload" href="/fonts/fraunces-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/dm-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
<!--include:style.css-->
  /* The credits list: one card per group, one row per project. */
  .credit-group { padding:24px; border-radius:20px; background:var(--card); border:1px solid var(--line); display:flex; flex-direction:column; gap:4px; }
  .credit-group h2 { font-size:22px; margin-bottom:6px; }
  .credits { list-style:none; margin:0; padding:0; }
  .credits li { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 12px; padding:12px 0; border-top:1px solid var(--line); }
  .credits li:first-child { border-top:0; }
  .credits .name { font-weight:500; flex:1 1 220px; }
  .credits .lic { color:var(--muted); font-size:14px; }
  .credits .used { flex-basis:100%; margin:0; color:var(--muted); font-size:14px; }
  .credits .support { font-size:14px; font-weight:500; color:var(--indigo); }
  .drawings { display:flex; flex-wrap:wrap; align-items:center; gap:20px; padding:24px; border-radius:20px; background:var(--lavender); }
  .drawings img { width:72px; height:72px; }
  .drawings div { flex:1 1 260px; display:flex; flex-direction:column; gap:8px; }
  .drawings p { margin:0; }
  @media (max-width:600px) { .credit-group, .drawings { padding:16px; } .credits .used, .credits .lic, .credits .support { font-size:13px; } }
</style>
</head>
<body>

<header class="wrap site-header">
  <a href="{{href_home}}" class="serif logo">Ellenial</a>
  <nav class="lang" aria-label="Language / Språk">
    <a href="{{href_en}}" lang="en" hreflang="en" data-lang="en" aria-label="English" {{current_en}}>EN</a>
    <a href="{{href_sv}}" lang="sv" hreflang="sv" data-lang="sv" aria-label="Svenska" {{current_sv}}>SV</a>
  </nav>
</header>

<main>
<section class="wrap" style="padding-top:calc(var(--section) * .5); padding-bottom:calc(var(--section) * .75); display:flex; flex-direction:column; gap:18px">
  <p class="eyebrow">{{thanks_eyebrow}}</p>
  <h1 class="serif">{{thanks_title}}</h1>
  <p class="muted lead">{{thanks_lead}}</p>
</section>

<div class="wrap section-break" aria-hidden="true"><img src="/icons/flower.svg" alt="" width="28" height="28"></div>

<section class="wrap" style="padding-bottom:var(--section); display:flex; flex-direction:column; gap:20px">
{{credits_list}}
  <p class="muted" style="margin:0">{{thanks_libraries}}</p>
</section>

<section class="wrap" style="padding-bottom:var(--section)">
  <div class="drawings">
    <img src="/drawings/flower.png" alt="" width="72" height="72">
    <div>
      <h2 class="serif" style="font-size:22px">{{thanks_drawings_title}}</h2>
      <p>{{thanks_drawings_text}}</p>
      <p><a href="/drawings">{{thanks_drawings_link}}</a></p>
    </div>
  </div>
</section>

<section class="wrap" style="padding-bottom:var(--section)">
  <p class="muted" style="margin:0; max-width:680px">{{thanks_paid}}</p>
</section>
</main>

<footer style="border-top:1px solid var(--line)">
  <div class="wrap muted" style="padding-top:32px; padding-bottom:40px; display:flex; flex-wrap:wrap; justify-content:space-between; gap:16px; font-size:14px">
    <p style="margin:0"><span class="serif" style="font-size:20px; color:var(--night)">Ellenial</span> · {{footer_tagline}}</p>
    <p style="margin:0">{{footer_made}} · <a href="https://github.com/phoenixcyberpunk/ellenial">{{footer_code}}</a></p>
    <span id="themeSlot" data-label="{{theme_label}}" data-auto="{{theme_auto}}" data-light="{{theme_light}}" data-dark="{{theme_dark}}" data-hint="{{theme_auto_hint}}"></span>
  </div>
</footer>

<script src="/app.js" defer></script>
</body>
</html>
