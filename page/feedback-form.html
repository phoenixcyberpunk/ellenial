<!-- The feedback form and its thank-you, shared by the home page card and /feedback (23 Nov 2026). -->
<p id="fbPreview" class="fb-preview" hidden>{{fb_preview}}</p>

<div id="fbFormView" class="fb-view">
  <noscript><p class="fb-error">{{fb_noscript}}</p></noscript>

  <form id="fbForm" class="fb-form" novalidate
    data-err-empty="{{fb_err_empty}}" data-err-limit="{{fb_err_limit}}" data-err-full="{{fb_err_full}}"
    data-err-fail="{{fb_err_fail}}" data-sending="{{fb_sending}}">
    <fieldset class="fb-kinds">
      <legend>{{fb_kind_legend}}</legend>
      <div class="fb-chips">
        <label class="chip-radio"><input type="radio" name="kind" value="idea" checked><span>{{fb_kind_idea}}</span></label>
        <label class="chip-radio"><input type="radio" name="kind" value="broken"><span>{{fb_kind_broken}}</span></label>
        <label class="chip-radio"><input type="radio" name="kind" value="kind"><span>{{fb_kind_kind}}</span></label>
      </div>
    </fieldset>

    <label class="fb-field" for="fbApp">{{fb_app_label}}</label>
    <select id="fbApp" name="app" class="fb-input">
      <option value="lunch">Lunch</option>
      <option value="weather">Weather</option>
      <option value="maps">Maps</option>
      <option value="quiz">Quiz</option>
      <option value="party-games">Party games</option>
      <option value="poll">Poll</option>
      <option value="bingo">Bingo</option>
      <option value="present">Present</option>
      <option value="split">{{split_title}}</option>
      <option value="gillefeeling">Gillefeeling</option>
      <option value="site">{{fb_app_site}}</option>
      <option value="new">{{fb_app_new}}</option>
    </select>

    <label class="fb-field" for="fbMsg">{{fb_msg_label}}</label>
    <textarea id="fbMsg" name="message" class="fb-input" rows="7" maxlength="1000" placeholder="{{fb_msg_placeholder}}" aria-describedby="fbCount"></textarea>
    <p id="fbCount" class="fb-count muted" aria-live="polite">0 / 1000</p>

    <!-- Trap for spam robots: hidden from people and screen readers. A filled-in trap is "sent" and quietly dropped. -->
    <div class="fb-trap" aria-hidden="true">
      <label for="fbWebsite">Website</label>
      <input id="fbWebsite" name="website" type="text" tabindex="-1" autocomplete="off">
    </div>

    <p class="fb-privacy muted">{{fb_privacy}}</p>
    <p id="fbError" class="fb-error" role="alert" hidden></p>
    <button type="submit" id="fbSend" class="btn fb-send">{{fb_send}}</button>
  </form>
</div>

<section id="fbDoneView" class="fb-view fb-done" hidden tabindex="-1" aria-labelledby="fbDoneTitle">
  <!-- Ellen's own drawing (placeholder: the flower until she picks one). -->
  <img class="fb-drawing" src="/drawings/flower.png" alt="" width="120" height="120">
  <h2 id="fbDoneTitle" class="serif">{{fb_done_title}}</h2>
  <p class="fb-lead">{{fb_done_text}}</p>
  <div class="fb-sent">
    <span class="muted">{{fb_done_you_sent}}</span>
    <span id="fbSummary" class="fb-summary"></span>
  </div>
  <div class="fb-actions">
    <a id="fbBack" class="btn fb-send" href="{{href_home}}" data-close="{{fb_done_close}}">{{fb_done_back}}</a>
    <button type="button" id="fbAgain" class="btn fb-ghost">{{fb_done_again}}</button>
  </div>
</section>
