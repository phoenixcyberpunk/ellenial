<!doctype html>
<!-- Template: the /feedback page (23 Nov 2026). One-way, anonymous: no account, no email, no reply.
     Sends only the kind, the app and the message. Only Ellen's inbox (inbox key) can read them.
     ?app=<id> preselects the app, so every app's footer can link here with its own id. -->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{fb_page_title}}</title>
<meta name="description" content="{{fb_lead}}">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FEF2E2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17141F" media="(prefers-color-scheme: dark)">
<script src="/ellenial-theme.js" data-light="#FEF2E2" data-dark="#17141F"></script>
<link rel="alternate" hreflang="en" href="https://ellenial.app/feedback">
<link rel="alternate" hreflang="sv" href="https://ellenial.app/sv/feedback">
<link rel="alternate" hreflang="x-default" href="https://ellenial.app/feedback">
<script src="/lang.js"></script>
<link rel="preload" href="/fonts/fraunces-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/dm-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
<!--include:style.css-->
<!--include:feedback.css--></style>
</head>
<body>

<header class="wrap site-header">
  <a href="{{href_home}}" class="serif logo">Ellenial</a>
  <nav class="lang" aria-label="Language / Språk">
    <a href="{{href_en}}" lang="en" hreflang="en" data-lang="en" aria-label="English" {{current_en}}>EN</a>
    <a href="{{href_sv}}" lang="sv" hreflang="sv" data-lang="sv" aria-label="Svenska" {{current_sv}}>SV</a>
  </nav>
</header>

<main class="wrap fb">
  <div class="fb-view" data-fb-hide-on-done>
    <h1 class="serif">{{fb_title}}</h1>
    <p class="muted fb-lead">{{fb_lead}}</p>
  </div>
<!--include:feedback-form.html-->
</main>

<footer class="ell-foot">
  <div class="ell-notes"><p>Ellenial™ · {{footer_tagline}}</p></div>
  <div class="ell-shared">
    <p>{{v5_title}}.</p>
    <p>{{footer_promise}}</p>
    <p>{{footer_counter}}</p>
    <p><a href="https://github.com/phoenixcyberpunk/ellenial">{{footer_code}}</a> · <a href="{{href_thanks}}">{{footer_thanks}}</a> · <a href="{{href_feedback}}" aria-current="page">{{footer_feedback}}</a></p>
  </div>
  <div class="ell-controls"><span id="themeSlot" data-label="{{theme_label}}" data-auto="{{theme_auto}}" data-light="{{theme_light}}" data-dark="{{theme_dark}}" data-hint="{{theme_auto_hint}}"></span></div>
</footer>

<script src="/app.js" defer></script>
<script src="/feedback.js" defer></script>
</body>
</html>
